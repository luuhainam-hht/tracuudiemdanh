<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bài kiểm tra & chấm bài – Khoa CNTT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
<style>
:root{--navy:#1E3A5F;--blue:#2563EB;--bg:#F1F5F9;--card:#fff;--text:#0F172A;--muted:#64748B;--ok:#166534;--okbg:#DCFCE7;--warn:#92400E;--warnbg:#FEF3C7;--bad:#991B1B;--badbg:#FEE2E2;--border:#E2E8F0;--teal:#0D9488;--tealbg:#CCFBF1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;color:var(--navy);margin:8px 0 2px}
h2{font-size:16px;color:var(--navy);margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea,button{font-family:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;color:var(--text);width:100%}
textarea{min-height:70px;resize:vertical}
button{background:var(--blue);color:#fff;border:0;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.sec{background:#fff;color:var(--navy);border:1px solid #CBD5E1}
button.warn{background:var(--badbg);color:var(--bad)}
button.ok{background:var(--tealbg);color:#115E59}
button.sm{width:auto;font-size:14px;padding:8px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.row .auto{flex:0 0 auto;width:auto}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.neu{background:var(--bg);color:var(--muted)}.teal{background:var(--tealbg);color:#115E59}
.err{color:var(--bad);background:var(--badbg);padding:10px;border-radius:10px;margin:8px 0}
.info{color:#1E40AF;background:#DBEAFE;padding:10px;border-radius:10px;margin:8px 0;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.center{text-align:center}
.loading{color:var(--muted);text-align:center;padding:12px}
.link{color:var(--blue);text-decoration:none;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top .sub{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #CBD5E1;background:#fff;font-size:13px;cursor:pointer;color:var(--navy);width:auto;font-weight:500}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bai{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.bai .t{font-weight:700;font-size:16px;color:var(--navy)}
.bai .m{font-size:13px;color:var(--muted);margin-top:2px}
.sv{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer}
.sv:hover{background:#F8FAFC}
.sv .stt{width:28px;color:var(--muted);font-size:13px;text-align:right}
.sv .n{flex:1;font-weight:500}
.sv .d{font-weight:700;color:var(--navy);min-width:36px;text-align:right}
.sv.on{background:#EFF6FF}
.chitiet{background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:12px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.thumb{position:relative;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;background:rgba(153,27,27,.9);color:#fff;border:0;border-radius:6px;width:26px;height:26px;padding:0;font-size:14px;line-height:26px;cursor:pointer}
.thumb .tt{position:absolute;bottom:0;left:0;right:0;background:rgba(15,23,42,.55);color:#fff;font-size:10px;padding:2px 4px;text-align:center}
.big{font-size:40px;font-weight:700;color:var(--blue);text-align:center;margin:4px 0 0}
.diemcell{display:flex;gap:8px;align-items:center}
.diemcell input{font-size:22px;font-weight:700;text-align:center;max-width:120px;color:var(--navy)}
.prog{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--teal);width:0;transition:width .2s}
.file{display:none}
.teps{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.tep{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff}
.tep .ic{font-size:22px}
.tep .tn{flex:1;min-width:0}.tep .tn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tep button{width:auto}
.chon{font-size:13px;color:var(--navy);background:#EFF6FF;border:1px dashed #93C5FD;border-radius:10px;padding:8px 10px;margin-top:6px}
.nhap{border:2px solid #14B8A6;border-radius:12px;padding:12px;margin-top:10px;background:#F0FDFA}
.nhap .nhap-t{font-weight:800;font-size:16px;color:#115E59;margin-bottom:4px}
.big-btn{font-size:18px;padding:14px 12px;margin-top:8px}
.q{border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.q .qn{font-weight:700;color:var(--navy);margin-bottom:6px;font-size:15px}
.q .qh{white-space:pre-wrap;font-size:15px;margin-bottom:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin:6px 0;cursor:pointer;background:#fff;font-size:15px}
.opt:hover{background:#F8FAFC}
.opt input[type=radio]{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--blue)}
.opt.on{background:#EFF6FF;border-color:#93C5FD}
.opt.dung{background:var(--okbg);border-color:#86EFAC}.opt.sai{background:var(--badbg);border-color:#FCA5A5}
.opt .lt{font-weight:700;color:var(--navy);flex:0 0 auto}
.opt.ed input[type=text]{flex:1;padding:6px 8px;font-size:14px}
.tnbar{position:sticky;top:0;z-index:20;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tnbar .tm{font-size:24px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.tnbar .tm.gap{color:var(--bad)}
.tnbar button{width:auto;white-space:nowrap}
.qe{border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0;background:#F8FAFC}
.qe textarea{min-height:56px;font-size:14px;margin-bottom:6px}
.qe .qdiem{width:70px;font-size:14px;padding:6px 8px}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--border)}
.stat .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}.stat .bar i{display:block;height:100%;background:var(--teal)}
.nhap .dsn{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:8px 0}
.nhap .it{position:relative;border:1px solid var(--border);border-radius:10px;background:#fff;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;text-align:center;padding:4px}
.nhap .it img{width:100%;height:100%;object-fit:cover}
.nhap .it .x{position:absolute;top:2px;right:2px;background:rgba(153,27,27,.9);color:#fff;border:0;border-radius:6px;width:22px;height:22px;padding:0;font-size:12px;line-height:22px}
.nhap .it .nm{position:absolute;bottom:0;left:0;right:0;background:rgba(15,23,42,.6);color:#fff;font-size:9px;padding:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer{position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:50;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer .bar{display:flex;gap:6px;padding:8px;justify-content:center;flex-wrap:wrap}
.viewer .bar button{width:auto;padding:8px 14px;background:#1E293B;color:#fff;font-size:14px}
.viewer .st{flex:1;overflow:hidden;position:relative;touch-action:none}
.viewer img{position:absolute;left:50%;top:50%;transform-origin:center center;max-width:none;user-select:none;-webkit-user-drag:none}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hd button{width:auto}
details summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:14px}
.kv{font-size:13px;color:var(--muted)}
.debai{white-space:pre-wrap;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Đang tải…</div></div>

<div class="viewer" id="viewer">
  <div class="bar">
    <button onclick="vZoom(1.25)">＋ Phóng to</button><button onclick="vZoom(0.8)">－ Thu nhỏ</button>
    <button onclick="vXoay()">↻ Xoay</button><button onclick="vReset()">Vừa màn hình</button><button onclick="vDong()">✕ Đóng</button>
  </div>
  <div class="st" id="vst"><img id="vimg" alt=""></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ĐỊA CHỈ API (Apps Script – Ứng dụng web, cùng địa chỉ với web tra cứu chuyên cần)
const API = 'https://script.google.com/macros/s/AKfycbywZYyrkQaWVjgMGZ6RUCB0dsJN-OsuOFc8gL526m0p3Owbgi2ODNtrxiB7gE0bamzU/exec';
const ANH_MAX = 1600, ANH_CHATLUONG = 0.82, TEP_MAX_MB = 10;
const CHAP_NHAN = 'image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar';
const EXT_MIME = { pdf: 'application/pdf', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', txt: 'text/plain', csv: 'text/csv', zip: 'application/zip', rar: 'application/vnd.rar' };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function luu(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function doc(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function xoaLuu(k) { try { localStorage.removeItem(k); } catch (e) {} }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmt(ms) { if (!ms) return ''; const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function fmtNgay(ms) { if (!ms) return ''; const d = new Date(ms); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); }
function toInputDT(ms) { if (!ms) return ''; const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function diemTxt(d) { return (d === '' || d === null || d === undefined) ? '' : Number(d).toLocaleString('vi-VN'); }
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', ms || 2500); }
function attrJ(v) { return JSON.stringify(v).replace(/"/g, '&quot;'); }
function fmtSize(b) { b = Number(b) || 0; return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : b >= 1024 ? Math.round(b / 1024) + ' KB' : b + ' B'; }
function iconTep(mime, ten) { mime = String(mime || ''); const e = String(ten || '').split('.').pop().toLowerCase(); if (/^image\//.test(mime)) return '🖼️'; if (mime === 'application/pdf' || e === 'pdf') return '📕'; if (/excel|spreadsheetml|csv/.test(mime) || /^(xlsx?|csv)$/.test(e)) return '📗'; if (/powerpoint|presentationml/.test(mime) || /^pptx?$/.test(e)) return '📙'; if (/msword|wordprocessingml/.test(mime) || /^docx?$/.test(e)) return '📘'; if (/zip|rar|compressed/.test(mime) || /^(zip|rar)$/.test(e)) return '🗜️'; return '📄'; }

// Gọi API bằng POST (JSON trong body dạng text/plain → không cần preflight CORS)
async function goi(payload) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  if (d && d.loi) throw new Error(d.loi);
  return d;
}

// ---------- Ảnh: nén trước khi tải, cache khi xem ----------
async function nenAnh(file) {
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = null; }
  let w, h, src;
  if (bmp) { w = bmp.width; h = bmp.height; src = bmp; }
  else {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Không đọc được ảnh ' + file.name)); im.src = URL.createObjectURL(file); });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const k = Math.min(1, ANH_MAX / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', ANH_CHATLUONG);
  return { mime: 'image/jpeg', b64: url.split(',')[1], dataUrl: url };
}
// Đọc 1 tệp người dùng chọn → {ten, mime, b64}: ảnh thì nén, tài liệu thì giữ nguyên (≤ TEP_MAX_MB)
async function docTep(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const mime = file.type || EXT_MIME[ext] || '';
  if (/^image\//.test(mime)) { const a = await nenAnh(file); return { ten: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', b64: a.b64 }; }
  if (!EXT_MIME[ext]) throw new Error('Không nhận loại tệp "' + file.name + '". Chỉ nhận ảnh, PDF, Word, Excel, PowerPoint, txt, csv, zip, rar.');
  if (file.size > TEP_MAX_MB * 1024 * 1024) throw new Error('Tệp "' + file.name + '" quá ' + TEP_MAX_MB + ' MB.');
  const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('Không đọc được ' + file.name)); r.readAsDataURL(file); });
  return { ten: file.name, mime: EXT_MIME[ext] || mime, b64: b64 };
}
// Tải lần lượt từng tệp (mỗi tệp 1 yêu cầu) – cơ sở: {maBai, loai, ten?} + quyền
async function taiLenTuanTu(files, coSo, pr) {
  if (pr) { pr.style.display = 'block'; pr.querySelector('i').style.width = '0%'; }
  for (let k = 0; k < files.length; k++) {
    if (pr) pr.querySelector('i').style.width = Math.round(k / files.length * 100) + '%';
    toast('Đang tải ' + (k + 1) + '/' + files.length + ': ' + files[k].name + '…', 30000);
    const t = await docTep(files[k]);
    await goi(Object.assign({ act: 'taianh', anh: [t] }, coSo, quyen()));
  }
  if (pr) pr.querySelector('i').style.width = '100%';
}
// Mở / tải tài liệu (không phải ảnh): lấy qua API rồi mở blob – PDF mở tab mới, loại khác tải về
async function moTep(id, ten, mime) {
  const w = mime === 'application/pdf' ? window.open('', '_blank') : null;
  try {
    toast('Đang tải ' + ten + '…', 30000);
    const u = await layAnh(id, 'lon');
    const blob = await (await fetch(u)).blob();
    const url = URL.createObjectURL(blob);
    if (w) w.location = url;
    else { const a = document.createElement('a'); a.href = url; a.download = ten || 'tep'; document.body.appendChild(a); a.click(); a.remove(); }
    toast('Đã mở ' + ten);
  } catch (e) { if (w) w.close(); toast('Lỗi: ' + e.message, 5000); }
}
const cacheAnh = {};
async function layAnh(id, kich) {
  const key = id + '|' + (kich || 'lon');
  if (cacheAnh[key]) return cacheAnh[key];
  const p = goi(Object.assign({ act: 'anh', id: id, kich: kich || 'lon' }, quyen())).then(d => 'data:' + d.mime + ';base64,' + d.b64);
  cacheAnh[key] = p;
  p.catch(() => { delete cacheAnh[key]; });
  return p;
}
function napThumb(el) { // el.dataset.id
  const id = el.dataset.id;
  layAnh(id, 'nho').then(u => { el.querySelector('img').src = u; }).catch(e => { el.querySelector('.tt').textContent = 'Lỗi: ' + e.message; });
}
function napTatCaThumb() { document.querySelectorAll('.thumb[data-id]:not([data-ok])').forEach(el => { el.dataset.ok = 1; napThumb(el); }); }
function gridAnh(tep, choXoa, xoaFn) { // tep: [{id, ten, mime, size, laAnh}]
  tep = tep || [];
  if (!tep.length) return '<div class="note">Chưa có tệp nào.</div>';
  const anh = tep.filter(t => t.laAnh), tl = tep.filter(t => !t.laAnh);
  const ids = anh.map(t => t.id);
  let h = '';
  if (anh.length) h += '<div class="grid">' + anh.map((t, i) => '<div class="thumb" data-id="' + esc(t.id) + '" onclick="xemAnh(' + attrJ(ids) + ',' + i + ')"><img alt="ảnh ' + (i + 1) + '"><div class="tt">' + esc(t.ten || ('Ảnh ' + (i + 1))) + '</div>' +
    (choXoa ? '<button class="x" title="Xoá" onclick="event.stopPropagation();' + xoaFn.replace('%ID%', t.id) + '">✕</button>' : '') + '</div>').join('') + '</div>';
  if (tl.length) h += '<div class="teps">' + tl.map(t => '<div class="tep"><span class="ic">' + iconTep(t.mime, t.ten) + '</span><div class="tn"><b>' + esc(t.ten) + '</b><span class="kv">' + fmtSize(t.size) + '</span></div>' +
    '<button class="sec sm" onclick="moTep(' + attrJ(t.id) + ',' + attrJ(t.ten) + ',' + attrJ(t.mime) + ')">' + (t.mime === 'application/pdf' ? 'Mở' : 'Tải về') + '</button>' +
    (choXoa ? '<button class="warn sm" onclick="' + xoaFn.replace('%ID%', t.id) + '">✕</button>' : '') + '</div>').join('') + '</div>';
  return h;
}

// ---------- Trình xem ảnh ----------
let vDs = [], vI = 0, vScale = 1, vRot = 0, vX = 0, vY = 0, vDrag = null, vPinch = null;
function xemAnh(ids, i) { vDs = ids; vI = i; $('viewer').classList.add('on'); vHien(); }
function vHien() {
  const img = $('vimg'); img.src = ''; img.alt = 'Đang tải…';
  layAnh(vDs[vI], 'lon').then(u => { img.onload = vReset; img.src = u; }).catch(e => toast('Lỗi tải ảnh: ' + e.message));
  $('viewer').querySelector('.bar').dataset.info = (vI + 1) + '/' + vDs.length;
}
function vApply() { $('vimg').style.transform = 'translate(-50%,-50%) translate(' + vX + 'px,' + vY + 'px) scale(' + vScale + ') rotate(' + vRot + 'deg)'; }
function vReset() {
  const img = $('vimg'), st = $('vst');
  const w = (vRot % 180) ? img.naturalHeight : img.naturalWidth, h = (vRot % 180) ? img.naturalWidth : img.naturalHeight;
  vScale = Math.min(st.clientWidth / w, st.clientHeight / h, 1) || 1; vX = 0; vY = 0; vApply();
}
function vZoom(k) { vScale = Math.max(0.05, Math.min(8, vScale * k)); vApply(); }
function vXoay() { vRot = (vRot + 90) % 360; vReset(); }
function vDong() { $('viewer').classList.remove('on'); }
(function () {
  const st = $('vst');
  st.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && vPinch) return; vDrag = { x: e.clientX - vX, y: e.clientY - vY }; st.setPointerCapture(e.pointerId); });

// Tách đề dán từ văn bản → [{hoi, pa, dung, diem}]
function tachDe(text) {
  const out = []; let cur = null;
  const dong = [];
  String(text || '').split(/\r?\n/).forEach(l => { // một dòng chứa nhiều phương án "A. x B. y" → tách ra
    const t = l.trim(); if (!t) return;
    const parts = t.split(/\s+(?=\*?[A-Fa-f][\.\)]\s)/);
    parts.forEach(x => dong.push(x));
  });
  dong.forEach(t => {
    let m;
    if ((m = t.match(/^(?:câu|cau|question|q)?\s*(\d+)\s*(\([^)]*\))?\s*[\.\):\-]\s*(.*)$/i))) {
      cur = { hoi: ((m[2] || '') + ' ' + m[3]).trim(), pa: [], dung: '', diem: 1 };
      const md = cur.hoi.match(/\(\s*(\d+(?:[.,]\d+)?)\s*(?:đ|điểm|diem|pts?)\s*\)/i); if (md) { cur.diem = Number(md[1].replace(',', '.')); cur.hoi = cur.hoi.replace(md[0], '').trim(); }
      out.push(cur); return;
    }
    if (cur && (m = t.match(/^(\*?)\s*([A-Fa-f])\s*[\.\):\-]\s*(.*)$/))) {
      let txt = m[3].trim(); let dung = m[1] === '*';
      if (/\*$/.test(txt) || /\((?:đúng|dung|correct)\)$/i.test(txt)) { dung = true; txt = txt.replace(/\*$/, '').replace(/\((?:đúng|dung|correct)\)$/i, '').trim(); }
      const k = m[2].toUpperCase().charCodeAt(0) - 65;
      while (cur.pa.length < k) cur.pa.push('');
      cur.pa[k] = txt; if (dung) cur.dung = 'ABCDEF'[k]; return;
    }
    if (cur && (m = t.match(/^(?:đáp án|dap an|đa|answer|key)\s*[:\-]?\s*([A-Fa-f])\b/i))) { cur.dung = m[1].toUpperCase(); return; }
    if (cur && (m = t.match(/^\(?\s*(\d+(?:[.,]\d+)?)\s*(?:đ|điểm|diem|pts?)\s*\)?$/i))) { cur.diem = Number(m[1].replace(',', '.')); return; }
    if (cur) { if (cur.pa.length) cur.pa[cur.pa.length - 1] += ' ' + t; else cur.hoi += (cur.hoi ? '\n' : '') + t; }
  });
  return out.map(q => { while (q.pa.length < 2) q.pa.push(''); return q; });
}

  const han = $('fHan').value ? new Date($('fHan').value).getTime() : null;

    p.loai = 'tn'; p.tnPhut = Number($('fPhut').value) || 0; p.tnXao = $('fXao').checked; p.tnKieu = $('fKieu').value; p.choNop = true;
    p.cauHoi = TN_CAU.map(q => ({ hoi: q.hoi, pa: q.pa, dung: q.dung, diem: q.diem, soPA: q.pa.length }));
    if (!p.cauHoi.length) { toast('Bài trắc nghiệm chưa có câu hỏi nào.', 5000); return; }
    const thieu = p.cauHoi.map((q, i) => (!q.dung ? i + 1 : 0)).filter(Boolean);
    if (thieu.length) { toast('Chưa chọn đáp án đúng cho câu: ' + thieu.slice(0, 10).join(', ') + (thieu.length > 10 ? '…' : ''), 7000); return; }
    if (p.tnKieu === 'web') { const trong = p.cauHoi.map((q, i) => (!q.hoi.trim() || !q.pa[0].trim() || !q.pa[1].trim() ? i + 1 : 0)).filter(Boolean); if (trong.length) { toast('Câu ' + trong.slice(0, 10).join(', ') + ': thiếu nội dung câu hỏi hoặc phương án A/B.', 7000); return; } }
  } else p.loai = 'tep';
  try {
    const r = await goi(p);
    const maBai = ma || r.ma;
    if (TEP_MOI.length) { await taiLenTuanTu(TEP_MOI, { maBai: maBai, loai: 'debai' }, $('pTep')); }
    toast('Đã lưu bài kiểm tra' + (TEP_MOI.length ? ' và ' + TEP_MOI.length + ' tệp đính kèm' : '') + ' ✅');
    TEP_MOI = [];
    await gvNapBai();
  } catch (e) { toast('Lỗi: ' + e.message, 6000); }
}
async function gvMoBai(ma) {
  SV_MO = -1; LOC = 'all';
  gvKhung('<div class="loading">Đang tải danh sách…</div>');
  try {
    const d = await goi({ act: 'gv_bainop', pin: PIN, maBai: ma });
    BAI = d.bai; DS_SV = d.sv; TN_GV = d.cauHoi || null; gvHienCham();
  } catch (e) { gvKhung('<div class="err">' + esc(e.message) + '</div>'); }
}
let TN_GV = null, TN_TK_MO = false; // câu hỏi + thống kê (bài trắc nghiệm) cho giảng viên
function gvThongKeTN() {
  if (!TN_GV || !TN_GV.length) return '';
  const daNop = DS_SV.filter(s => s.traLoi).length;
  let h = '<details style="margin:8px 0" ontoggle="TN_TK_MO=this.open"' + (TN_TK_MO ? ' open' : '') + '><summary>📊 Thống kê từng câu (' + daNop + ' bài đã nộp) • đáp án</summary>';
  TN_GV.forEach((q, k) => { const pt = q.lamSo ? Math.round(q.dungSo / q.lamSo * 100) : 0; h += '<div class="stat"><b style="width:52px">Câu ' + (k + 1) + '</b><span class="badge ok" style="padding:2px 8px">' + esc(q.dung) + '</span><div class="bar"><i style="width:' + pt + '%"></i></div><span style="width:110px;text-align:right">' + q.dungSo + '/' + q.lamSo + ' đúng (' + pt + '%)</span></div>' + (q.hoi ? '<div class="kv" style="padding:0 0 4px 52px">' + esc(q.hoi.length > 140 ? q.hoi.slice(0, 140) + '…' : q.hoi) + '</div>' : ''); });
  h += '<div class="row" style="margin-top:8px"><button class="sec sm auto" onclick="gvChamLai()">🔄 Chấm lại tất cả theo đáp án hiện tại</button><span class="kv">Dùng sau khi sửa đáp án (trên web hoặc sheet CÂU HỎI TN).</span></div></details>';
  return h;
}
async function gvChamLai() {
  if (!confirm('Chấm lại toàn bộ bài đã nộp theo đáp án hiện tại? Điểm trong sổ sẽ được ghi đè.')) return;
  try { const r = await goi({ act: 'gv_chamlai', pin: PIN, maBai: BAI.ma }); toast('Đã chấm lại ' + r.so + ' bài ✅'); await gvLamMoiSV(); } catch (e) { toast('Lỗi: ' + e.message, 6000); }
}
function gvHienCham() {
  const b = BAI;
  const dem = { all: DS_SV.length, chua: DS_SV.filter(s => s.trangThai === 'Chưa nộp').length, nop: DS_SV.filter(s => s.trangThai === 'Đã nộp').length, cham: DS_SV.filter(s => s.trangThai === 'Đã chấm').length };
  let h = '<div class="card"><div class="hd"><button class="sec sm" onclick="gvNapBai()" style="white-space:nowrap">← Bài</button><div><b style="color:var(--navy)">' + esc(b.ten) + '</b><div class="kv">' + esc(b.lop) + ' • ' + esc(b.dauDiem) + (b.han ? ' • hạn ' + fmt(b.han) : '') + '</div></div></div>' +
    '<div class="chips">' + [['all', 'Tất cả'], ['chua', 'Chưa nộp'], ['nop', 'Đã nộp – chờ chấm'], ['cham', 'Đã chấm']].map(x => '<button class="chip' + (LOC === x[0] ? ' on' : '') + '" onclick="LOC=\'' + x[0] + '\';SV_MO=-1;gvHienCham()">' + x[1] + ' (' + dem[x[0]] + ')</button>').join('') + '</div>' + gvThongKeTN();
  const ds = DS_SV.map((s, i) => ({ s, i })).filter(x => LOC === 'all' || (LOC === 'chua' && x.s.trangThai === 'Chưa nộp') || (LOC === 'nop' && x.s.trangThai === 'Đã nộp') || (LOC === 'cham' && x.s.trangThai === 'Đã chấm'));
  if (!ds.length) h += '<div class="note center">Không có sinh viên nào trong nhóm này.</div>';
  ds.forEach(x => {
    const s = x.s, i = x.i;
    const cls = s.trangThai === 'Đã chấm' ? 'ok' : s.trangThai === 'Đã nộp' ? 'teal' : s.trangThai === 'Đang làm' ? 'warn' : 'neu';
    h += '<div class="sv' + (SV_MO === i ? ' on' : '') + '" onclick="gvMoSV(' + i + ')"><div class="stt">' + esc(s.stt || '') + '</div><div class="n">' + esc(s.ten) + (s.anh.length ? ' <span class="kv">📷' + s.anh.length + '</span>' : '') + (s.soDung ? ' <span class="kv">☑️ ' + esc(s.soDung) + '</span>' : '') + '</div><span class="badge ' + cls + '">' + esc(s.trangThai) + '</span><div class="d">' + diemTxt(s.diem !== '' ? s.diem : s.diemSo) + '</div></div>';
    if (SV_MO === i) h += gvChiTiet(s, i);
  });
  h += '</div>';
  gvKhung(h);
  napTatCaThumb();
  if (SV_MO >= 0) { const el = document.querySelector('.sv.on'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
function gvChiTiet(s, i) {
  const link = s.ma ? (location.origin + location.pathname + '?ma=' + s.ma) : '';
  let h = '<div class="chitiet" onclick="event.stopPropagation()">';
  if (BAI.loai === 'tn') {
    if (s.traLoi && TN_GV) {
      const tl = {}; s.traLoi.split(',').forEach(x => { const p = x.split(':'); tl[p[0]] = p[1]; });
      h += '<div class="kv">Bài làm trắc nghiệm • nộp lúc ' + fmt(s.nopLuc) + (s.batDau ? ' • bắt đầu ' + fmt(s.batDau) : '') + ' • đúng <b>' + esc(s.soDung) + '</b>:</div><div class="chips">' +
        TN_GV.map((q, k) => { const c = tl[q.stt]; const ok = c === q.dung; return '<span class="badge ' + (c === '-' || !c ? 'neu' : ok ? 'ok' : 'bad') + '" title="' + esc(q.hoi) + '">' + (k + 1) + ': ' + (c && c !== '-' ? c : '–') + (ok ? ' ✓' : ' (' + esc(q.dung) + ')') + '</span>'; }).join('') + '</div>';
    } else h += '<div class="note">' + (s.trangThai === 'Đang làm' ? '⏱️ Đang làm bài (bắt đầu ' + fmt(s.batDau) + '), chưa nộp.' : 'Chưa làm bài trắc nghiệm.') + '</div>';
    if (s.tep && s.tep.length) h += gridAnh(s.tep, true, "gvXoaAnh('" + esc(BAI.ma) + "','bailam'," + attrJ(s.ten) + ",'%ID%')");
  } else {
  h += '<div class="kv">Bài làm' + (s.nopLuc ? ' • nộp lúc ' + fmt(s.nopLuc) + (s.nguoiTai ? ' (' + esc(s.nguoiTai) + ')' : '') : '') + ':</div>';
  h += gridAnh(s.tep, true, "gvXoaAnh('" + esc(BAI.ma) + "','bailam'," + attrJ(s.ten) + ",'%ID%')");
  h += '<input class="file" type="file" accept="' + CHAP_NHAN + '" multiple id="fa' + i + '" onchange="gvTaiAnh(\'' + esc(BAI.ma) + '\',\'bailam\',' + attrJ(s.ten) + ',this)">' +
    '<div class="row"><button class="sec sm" onclick="$(\'fa' + i + '\').click()">📷 Tải ảnh / tệp hộ sinh viên</button>' + (link ? '<button class="sec sm" onclick="chepLink(' + JSON.stringify(link).replace(/"/g, '&quot;') + ')">🔗 Sao chép link riêng</button>' : '<span class="kv">Chưa có mã riêng – chạy menu 🔑 trong Sheets</span>') + '</div>' +
    '<div class="prog" id="pa' + i + '" style="display:none"><i></i></div>';
  }
  if (BAI.loai === 'tn' && link) h += '<div class="row"><button class="sec sm auto" onclick="chepLink(' + JSON.stringify(link).replace(/"/g, '&quot;') + ')">🔗 Sao chép link riêng</button></div>';
  h += '<label>Điểm ' + esc(BAI.dauDiem) + ' (0–10)' + (s.diemSo !== '' && s.diem === '' ? ' – <span class="warn badge">sổ điểm đang có ' + diemTxt(s.diemSo) + '</span>' : '') + '</label>' +
    '<div class="diemcell"><input id="d' + i + '" type="number" inputmode="decimal" min="0" max="10" step="0.25" value="' + (s.diem === '' ? '' : s.diem) + '" placeholder="—">' +
    '<div class="chips" style="margin:0">' + [10, 9, 8, 7, 6, 5].map(v => '<button class="chip" onclick="$(\'d' + i + '\').value=' + v + '">' + v + '</button>').join('') + '</div></div>' +
    '<label>Nhận xét (sinh viên nhìn thấy)</label><textarea id="nx' + i + '" placeholder="VD: Câu 2 sai công thức; trình bày tốt.">' + esc(s.nhanXet) + '</textarea>' +
    '<div class="row" style="margin-top:10px"><button onclick="gvCham(' + i + ', false)">💾 Lưu điểm' + (gvTiep(i) >= 0 ? ' & sang bài tiếp' : '') + '</button>' +
    (s.diem !== '' ? '<button class="warn auto sm" onclick="gvCham(' + i + ', true)">Xoá điểm' + (BAI.loai === 'tn' ? ' (cho làm lại)' : '') + '</button>' : '') + '</div>' +
    (s.chamLuc ? '<div class="note">Chấm lúc ' + fmt(s.chamLuc) + '. Điểm đã ghi vào sổ điểm (sheet ĐIỂM / HÔM NAY / web tra cứu).</div>' : '') + '</div>';
  return h;
}
function gvTiep(i) { for (let k = i + 1; k < DS_SV.length; k++) if (DS_SV[k].trangThai !== 'Đã chấm' && (LOC === 'all' || (LOC === 'nop' && DS_SV[k].trangThai === 'Đã nộp') || (LOC === 'chua' && DS_SV[k].trangThai === 'Chưa nộp'))) return k; return -1; }
function gvMoSV(i) { SV_MO = SV_MO === i ? -1 : i; gvHienCham(); }
async function gvCham(i, xoa) {
  const s = DS_SV[i];
  const diem = xoa ? '' : $('d' + i).value.trim().replace(',', '.');
  if (!xoa && (diem === '' || isNaN(Number(diem)) || Number(diem) < 0 || Number(diem) > 10)) { toast('Nhập điểm từ 0 đến 10.'); return; }
  if (xoa && !confirm('Xoá điểm ' + BAI.dauDiem + ' của ' + s.ten + ' khỏi sổ điểm?')) return;
  const nx = $('nx' + i).value;
  try {
    const r = await goi({ act: 'gv_cham', pin: PIN, maBai: BAI.ma, ten: s.ten, diem: diem, nhanXet: nx });
    s.diem = diem === '' ? '' : Number(diem); s.nhanXet = nx; s.chamLuc = diem === '' ? null : r.chamLuc; s.diemSo = s.diem;
    s.trangThai = s.diem !== '' ? 'Đã chấm' : (s.anh.length ? 'Đã nộp' : 'Chưa nộp');
    if (xoa && BAI.loai === 'tn') { s.traLoi = ''; s.soDung = ''; s.batDau = null; }
    toast(xoa ? 'Đã xoá điểm.' : 'Đã lưu ' + diemTxt(s.diem) + ' điểm cho ' + s.ten + ' ✅');
    const t = xoa ? -1 : gvTiep(i);
    SV_MO = t >= 0 ? t : (xoa ? i : -1);
    gvHienCham();
  } catch (e) { toast('Lỗi: ' + e.message, 6000); }
}
async function gvTaiAnh(maBai, loai, ten, inp) {
  const files = [...inp.files]; if (!files.length) return;
  const pr = loai === 'bailam' ? $('pa' + SV_MO) : null;
  try {
    await taiLenTuanTu(files, { maBai: maBai, loai: loai, ten: ten }, pr);
    toast('Đã tải ' + files.length + ' tệp ✅');
    if (loai === 'debai') { await gvNapBai(); gvFormBai(maBai); } else await gvLamMoiSV();
  } catch (e) { toast('Lỗi: ' + e.message, 6000); if (pr) pr.style.display = 'none'; }
}
async function gvXoaAnh(maBai, loai, ten, id) {
  if (!confirm('Xoá tệp này?')) return;
  try {
    await goi({ act: 'xoaanh', pin: PIN, maBai: maBai, loai: loai, ten: ten, id: id });
    toast('Đã xoá tệp.');
    if (loai === 'debai') { await gvNapBai(); gvFormBai(maBai); } else await gvLamMoiSV();
  } catch (e) { toast('Lỗi: ' + e.message, 5000); }
}
async function gvLamMoiSV() { // nạp lại danh sách nộp, giữ sinh viên đang mở
  const mo = SV_MO;
  const d = await goi({ act: 'gv_bainop', pin: PIN, maBai: BAI.ma });
  BAI = d.bai; DS_SV = d.sv; SV_MO = mo; gvHienCham();
}
function chepLink(link) {
  const ok = () => toast('Đã sao chép link riêng – gửi cho đúng sinh viên.');
  if (navigator.clipboard) navigator.clipboard.writeText(link).then(ok, () => prompt('Sao chép link:', link)); else prompt('Sao chép link:', link);
}

khoiDong();
</script>
