<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tra cứu chuyên cần – Khoa CNTT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
:root{--navy:#1E3A5F;--blue:#2563EB;--bg:#F1F5F9;--card:#fff;--text:#0F172A;--muted:#64748B;--ok:#166534;--okbg:#DCFCE7;--warn:#92400E;--warnbg:#FEF3C7;--bad:#991B1B;--badbg:#FEE2E2;--border:#E2E8F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;color:var(--navy);margin:8px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
select,button{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;color:var(--text)}
button{background:var(--blue);color:#fff;border:0;font-weight:600;margin-top:12px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--navy)}
.kpi span{font-size:11px;color:var(--muted)}
.big{font-size:44px;font-weight:700;color:var(--blue);text-align:center;margin:6px 0 0}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.neu{background:var(--bg);color:var(--muted)}
.chuoi{font-family:ui-monospace,Menlo,monospace;color:var(--blue);letter-spacing:2px;font-size:18px;text-align:center;margin:8px 0;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.err{color:var(--bad);background:var(--badbg);padding:10px;border-radius:10px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.center{text-align:center}
.loading{color:var(--muted);text-align:center;padding:12px}
.link{color:var(--blue);text-decoration:none;font-size:13px}
.banner{border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.5;border:1px solid transparent}
.banner.ok{background:var(--okbg);color:var(--ok);border-color:#86EFAC}
.banner.bad{background:var(--badbg);color:var(--bad);border-color:#FCA5A5}
.banner.neu{background:#fff;color:var(--text);border-color:var(--border)}
.banner b{font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 Tra cứu chuyên cần</h1>
  <div class="sub" id="donvi">Đang tải…</div>
  <div class="card">
    <label for="lop">Lớp</label>
    <select id="lop"><option value="">— Chọn lớp —</option></select>
    <label for="ten">Họ tên</label>
    <select id="ten" disabled><option value="">— Chọn lớp trước —</option></select>
    <button id="btn" disabled onclick="traCuu()">Tra cứu</button>
  </div>
  <div id="kq"></div>
  <div class="note center">Số liệu cập nhật trực tiếp từ sổ điểm danh của giảng viên. Thắc mắc liên hệ giảng viên phụ trách.</div>
</div>

<script>
// ĐỊA CHỈ API (Apps Script – Ứng dụng web). Nếu triển khai lại ở Apps Script, link này KHÔNG đổi.
const API = 'https://script.google.com/macros/s/AKfycbywZYyrkQaWVjgMGZ6RUCB0dsJN-OsuOFc8gL526m0p3Owbgi2ODNtrxiB7gE0bamzU/exec';

let CFG = null;
function $(id) { return document.getElementById(id); }

// Gọi API: ưu tiên fetch (CORS); nếu trình duyệt chặn thì dùng JSONP.
function goiApi(params) {
  const qs = Object.keys(params).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
  const url = API + '?' + qs + '&_=' + Date.now();
  return fetch(url, { method: 'GET', redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(() => new Promise((resolve, reject) => {
      const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e6);
      const s = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('Không kết nối được máy chủ.')); }, 20000);
      function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = d => { cleanup(); resolve(d); };
      s.onerror = () => { cleanup(); reject(new Error('Không kết nối được máy chủ.')); };
      s.src = url + '&callback=' + cb;
      document.body.appendChild(s);
    }));
}

function luu(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function doc(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

const qp = new URLSearchParams(location.search);
const lopMacDinh = qp.get('lop') || doc('lop');
const tenMacDinh = qp.get('ten') || doc('ten');

goiApi({ api: 'cauhinh' }).then(c => {
  CFG = c;
  $('donvi').textContent = c.donVi + (c.gv ? '  •  GV: ' + c.gv : '');
  c.lops.forEach(l => {
    const o = document.createElement('option');
    o.value = l.sheet; o.textContent = l.sheet + (l.ma ? ' (' + l.ma + ')' : '');
    $('lop').appendChild(o);
  });
  if (lopMacDinh && c.lops.some(l => l.sheet === lopMacDinh)) { $('lop').value = lopMacDinh; napSV(lopMacDinh, tenMacDinh); }
}).catch(e => { $('donvi').textContent = 'Lỗi tải cấu hình: ' + e.message; });

function napSV(lop, chon) {
  $('ten').disabled = true; $('btn').disabled = true;
  $('ten').innerHTML = '<option value="">Đang tải…</option>';
  if (!lop) { $('ten').innerHTML = '<option value="">— Chọn lớp trước —</option>'; return; }
  goiApi({ api: 'sv', lop: lop }).then(ds => {
    $('ten').innerHTML = '<option value="">— Chọn họ tên —</option>';
    ds.forEach(s => {
      const o = document.createElement('option');
      o.value = s.ten; o.textContent = (s.stt ? s.stt + '. ' : '') + s.ten;
      $('ten').appendChild(o);
    });
    $('ten').disabled = false;
    if (chon && ds.some(s => s.ten === chon)) { $('ten').value = chon; $('btn').disabled = false; if (qp.get('ten')) traCuu(); }
  }).catch(e => { $('ten').innerHTML = '<option value="">Lỗi: ' + e.message + '</option>'; });
}

$('lop').onchange = function () { $('kq').innerHTML = ''; napSV(this.value, ''); };
$('ten').onchange = function () { $('btn').disabled = !this.value; };

function pct(x) { return (Math.round(x * 1000) / 10).toLocaleString('vi-VN') + '%'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function traCuu() {
  const l = $('lop').value, t = $('ten').value;
  if (!l || !t) return;
  $('btn').disabled = true;
  $('kq').innerHTML = '<div class="loading">Đang tra cứu…</div>';
  goiApi({ api: 'tracuu', lop: l, ten: t }).then(d => { luu('lop', l); luu('ten', t); hien(d); })
    .catch(e => { $('kq').innerHTML = '<div class="err">Lỗi: ' + esc(e.message) + '</div>'; $('btn').disabled = false; });
}

function hien(d) {
  $('btn').disabled = false;
  if (d.loi) { $('kq').innerHTML = '<div class="err">' + esc(d.loi) + '</div>'; return; }
  const cls = d.trangThai === 'Cấm thi' ? 'bad' : d.trangThai === 'Cảnh báo' ? 'warn' : d.trangThai === 'Đủ ĐK' ? 'ok' : 'neu';
  const tt = d.trangThai === 'Cấm thi' ? 'Vắng quá mức – cấm thi' : d.trangThai === 'Đủ ĐK' ? 'Chuyên cần đạt' : d.trangThai === 'Cảnh báo' ? 'Cảnh báo chuyên cần' : d.trangThai;
  let h = '';
  // Điều kiện dự thi (chuyên cần + đủ số đầu điểm kiểm tra)
  if (d.soDauDiemCan) {
    const co = d.soDauDiemCo || 0, can = d.soDauDiemCan;
    if (d.camThi) {
      h += '<div class="banner bad"><b>❌ Không đủ điều kiện dự thi</b><br>Bạn vắng quá mức cho phép. Liên hệ giảng viên phụ trách.</div>';
    } else if (d.duDKThi) {
      h += '<div class="banner ok"><b>✅ Đã đủ điều kiện dự thi</b><br>Chuyên cần đạt và đã có đủ ' + co + '/' + can + ' đầu điểm kiểm tra.</div>';
    } else if (d.nhacThieuDiem) {
      h += '<div class="banner bad"><b>⚠️ Bạn còn thiếu điểm kiểm tra (' + co + '/' + can + ')</b><br>Môn học kết thúc ngày ' + esc(d.ngayKetThuc) + (d.conNgay > 0 ? ' (còn ' + d.conNgay + ' ngày)' : d.conNgay === 0 ? ' (hôm nay)' : ' (đã kết thúc)') + '. Liên hệ giảng viên ngay để hoàn thành bài kiểm tra.</div>';
    } else {
      h += '<div class="banner neu"><b>📋 Điều kiện dự thi: đang theo dõi</b><br>Đã có ' + co + '/' + can + ' đầu điểm kiểm tra' + (d.ngayKetThuc ? ' – môn học kết thúc ngày ' + esc(d.ngayKetThuc) : '') + '.</div>';
    }
  }
  h += '<div class="card"><div class="center"><b>' + esc(d.ten) + '</b><br><span class="sub">' + esc(d.lop) + (d.maLop ? ' • ' + esc(d.maLop) : '') + (d.khoa ? ' • ' + esc(d.khoa) : '') + '</span></div>';
  h += '<div class="big">' + pct(d.ptCC) + '</div><div class="center sub">tỷ lệ chuyên cần</div>';
  h += '<div class="center"><span class="badge ' + cls + '">' + esc(tt) + '</span></div>';
  h += '<div class="kpi"><div><b>' + d.daHoc + '</b><span>buổi đã học</span></div><div><b>' + d.coMat + '</b><span>có mặt</span></div><div><b>' + (d.vangP + d.vangK) + '</b><span>vắng (' + d.vangK + ' không phép)</span></div></div>';
  h += '<div class="kpi" style="grid-template-columns:1fr 1fr"><div><b>' + d.conDuocVang + '</b><span>buổi còn được vắng</span></div><div><b>' + d.tongKH + '</b><span>buổi theo kế hoạch</span></div></div>';
  h += '<div class="chuoi">' + esc(d.chuoi) + '</div><div class="center sub">● có mặt &nbsp; ○ vắng không phép &nbsp; ◐ vắng có phép</div>';
  h += '<div class="note">Cảnh báo khi vắng > ' + Math.round(CFG.canhBao * 100) + '%, không đủ điều kiện dự thi khi vắng > ' + Math.round(CFG.camThi * 100) + '% số buổi. Cập nhật: ' + esc(d.capNhat) + '</div>';
  const link = location.origin + location.pathname + '?lop=' + encodeURIComponent(d.lop) + '&ten=' + encodeURIComponent(d.ten);
  h += '<div class="center" style="margin-top:8px"><a class="link" href="' + link + '">🔗 Link riêng của bạn (lưu lại để lần sau mở là thấy ngay)</a></div></div>';
  h += '<div class="card"><b>📝 Điểm kiểm tra</b>';
  if (d.diem && d.diem.kt && d.diem.kt.length) {
    h += '<table><tr><th>Đầu điểm</th><th>Điểm</th><th>Nhập lúc</th></tr>';
    d.diem.kt.forEach(k => {
      const c = k.diem < 5 ? 'bad' : k.diem >= 8 ? 'ok' : 'neu';
      h += '<tr><td>' + esc(k.ten) + '</td><td><span class="badge ' + c + '" style="font-size:13px;padding:3px 10px">' + k.diem.toLocaleString('vi-VN') + '</span></td><td>' + esc(k.luc) + '</td></tr>';
    });
    h += '</table><div class="center" style="margin-top:10px">Trung bình kiểm tra: <b style="font-size:20px;color:var(--navy)">' + d.diem.tb.toLocaleString('vi-VN') + '</b></div>';
    if (d.diem.ghiChu) h += '<div class="note">Ghi chú của giảng viên: ' + esc(d.diem.ghiChu) + '</div>';
  } else {
    h += '<div class="note center">Chưa có điểm kiểm tra nào được nhập.</div>';
  }
  h += '</div>';
  h += '<div class="card"><b>Lịch sử điểm danh</b><table><tr><th>Ngày</th><th>Thứ</th><th>Trạng thái</th></tr>';
  d.lich.forEach(x => {
    const c = x.trangThai === 'Có mặt' ? 'ok' : x.trangThai === 'Vắng có phép' ? 'warn' : 'bad';
    h += '<tr><td>' + esc(x.ngay) + '</td><td>' + esc(x.thu) + '</td><td><span class="badge ' + c + '" style="font-size:12px;padding:3px 8px">' + esc(x.trangThai) + '</span></td></tr>';
  });
  h += '</table></div>';
  $('kq').innerHTML = h;
  window.scrollTo({ top: $('kq').offsetTop - 8, behavior: 'smooth' });
}
</script>
</body>
</html>
